<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blue Horizon - Anime GFX</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: radial-gradient(circle at 50% 0%, #193e83 0, #07122f 56%, #030817 100%);
      color: #eaf8ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .shell { width: min(1180px, 100%); margin: 0 auto; padding: 24px; }
    .top { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .eyebrow { margin: 0 0 8px; color: #8ee8ff; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 52px); line-height: .95; letter-spacing: -.04em; }
    .intro { max-width: 410px; margin: 0; color: #a9c6e5; font-size: 13px; line-height: 1.6; }
    .stage { display: grid; place-items: center; padding: 18px; border: 1px solid #8be8ff33; border-radius: 28px; background: #03102b80; box-shadow: 0 24px 90px #01051299; }
    .poster { display: block; width: min(100%, 480px); height: auto; border-radius: 18px; box-shadow: 0 16px 70px #001b4dcc; }
    .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; }
    .meta { color: #85a8cb; font-size: 12px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    a { color: #061632; background: #c7f5ff; border-radius: 999px; padding: 10px 15px; font-size: 12px; font-weight: 800; text-decoration: none; }
    a.alt { color: #dff8ff; background: #143967; border: 1px solid #8be8ff55; }
    @media (max-width: 680px) { .shell { padding: 14px; } .top { display: block; } .intro { margin-top: 12px; } .stage { padding: 8px; border-radius: 20px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div>
        <p class="eyebrow">Anime key visual / blue series</p>
        <h1>Blue Horizon</h1>
      </div>
      <p class="intro">A cool blue sky, soft rose highlights and layered light keep the supplied character as the focal point.</p>
    </header>
    <section class="stage" aria-label="Anime GFX preview">
      <img class="poster" src="anime-blue-gfx.svg" alt="Blue Horizon anime GFX poster">
    </section>
    <div class="bar">
      <span class="meta">1080 x 1920 / portrait / SVG + PNG</span>
      <nav class="actions" aria-label="Downloads">
        <a href="anime-blue-gfx.png" download>Download PNG</a>
        <a class="alt" href="anime-blue-gfx.svg" download>Download SVG</a>
      </nav>
    </div>
  </main>
</body>
</html>
