<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Blue Horizon anime GFX</title>
  <desc id="desc">A blue anime key visual with a pink-haired character under a clear umbrella, light rays, clouds and glowing particles.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#071a58"/>
      <stop offset="0.28" stop-color="#164c9d"/>
      <stop offset="0.62" stop-color="#56aee5"/>
      <stop offset="1" stop-color="#d8f6ff"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="78%" cy="15%" r="45%">
      <stop offset="0" stop-color="#fffce9" stop-opacity=".98"/>
      <stop offset=".08" stop-color="#fff8d4" stop-opacity=".78"/>
      <stop offset=".25" stop-color="#c9edff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#bfeaff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb7b0" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#ff9fb0" stop-opacity=".11"/>
      <stop offset="1" stop-color="#ff9fb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset=".62" stop-color="#eaf8ff" stop-opacity=".82"/>
      <stop offset="1" stop-color="#a9cce9" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="cloudShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f2ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2d6da4" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#b7efff"/>
      <stop offset="1" stop-color="#ffd0d2"/>
    </linearGradient>
    <filter id="cloudBlur" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="characterGlow" x="-40%" y="-30%" width="180%" height="170%">
      <feFlood flood-color="#66e8ff" flood-opacity=".86" result="color"/>
      <feComposite in="color" in2="SourceAlpha" operator="in" result="shape"/>
      <feGaussianBlur in="shape" stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/></feMerge>
    </filter>
    <filter id="characterShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#03133e" flood-opacity=".62"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#sky)"/>
  <rect width="1080" height="1920" fill="url(#sunGlow)"/>

  <g opacity=".18" fill="#fff8e6">
    <path d="M820 255 L1080 510 L1010 530 Z"/>
    <path d="M820 255 L1080 680 L1000 650 Z"/>
    <path d="M820 255 L935 870 L875 800 Z"/>
    <path d="M820 255 L710 830 L770 760 Z"/>
    <path d="M820 255 L540 710 L650 630 Z"/>
  </g>

  <g fill="#eaf8ff">
    <circle cx="130" cy="198" r="2" opacity=".55"/><circle cx="242" cy="102" r="3" opacity=".42"/>
    <circle cx="348" cy="286" r="2" opacity=".72"/><circle cx="472" cy="124" r="2" opacity=".5"/>
    <circle cx="607" cy="206" r="3" opacity=".68"/><circle cx="746" cy="108" r="2" opacity=".7"/>
    <circle cx="931" cy="162" r="3" opacity=".6"/><circle cx="1014" cy="296" r="2" opacity=".8"/>
    <circle cx="84" cy="612" r="2" opacity=".4"/><circle cx="972" cy="536" r="2" opacity=".46"/>
  </g>

  <g filter="url(#cloudBlur)">
    <path d="M-90 436 C-22 373 41 369 102 414 C141 331 255 321 310 405 C388 370 506 426 493 500 C484 554 408 574 335 559 L-90 568 Z" fill="url(#cloud)" opacity=".62"/>
    <path d="M660 488 C712 424 795 429 830 487 C889 436 1000 466 1014 540 C1040 551 1080 564 1115 610 L650 654 C612 604 619 538 660 488 Z" fill="url(#cloud)" opacity=".55"/>
    <path d="M-100 913 C-18 831 80 852 121 920 C195 858 306 883 321 959 C368 976 394 1022 382 1065 L-100 1090 Z" fill="url(#cloud)" opacity=".46"/>
  </g>

  <ellipse cx="700" cy="770" rx="390" ry="545" fill="url(#coralGlow)" opacity=".95"/>

  <g fill="none" stroke="#d9f8ff" stroke-linecap="round">
    <ellipse cx="582" cy="895" rx="405" ry="610" stroke-width="2" opacity=".26" transform="rotate(-18 582 895)"/>
    <ellipse cx="582" cy="895" rx="355" ry="550" stroke-width="1.5" opacity=".2" transform="rotate(28 582 895)"/>
    <circle cx="586" cy="895" r="364" stroke-width="1" opacity=".32" stroke-dasharray="3 20"/>
    <path d="M228 754 C376 493 742 436 938 614" stroke-width="2" opacity=".28" stroke-dasharray="2 14"/>
    <path d="M194 1125 C391 1376 768 1404 957 1188" stroke-width="2" opacity=".2" stroke-dasharray="2 18"/>
  </g>

  <g fill="#ffffff">
    <path d="M151 765 l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" opacity=".7"/>
    <path d="M933 760 l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity=".8"/>
    <path d="M260 1242 l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" opacity=".58"/>
    <path d="M863 1130 l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" opacity=".6"/>
  </g>

  <g opacity=".72" filter="url(#softShadow)">
    <path d="M-60 1515 C86 1438 231 1467 320 1542 C431 1443 602 1492 640 1580 C772 1482 1023 1501 1140 1610 L1140 1940 L-60 1940 Z" fill="url(#cloudShadow)"/>
  </g>

  <path d="M0 1640 C169 1550 296 1643 410 1718 C565 1822 705 1668 820 1602 C931 1539 1027 1592 1080 1644 L1080 1920 L0 1920 Z" fill="#86c8e6" opacity=".48"/>
  <path d="M0 1744 C112 1655 214 1741 298 1814 C400 1900 501 1845 588 1758 C679 1667 773 1714 853 1810 C936 1908 1013 1858 1080 1780 L1080 1920 L0 1920 Z" fill="#22577f" opacity=".76"/>

  <g opacity=".5" fill="#ffffff">
    <circle cx="92" cy="1400" r="4"/><circle cx="192" cy="1305" r="3"/><circle cx="948" cy="1440" r="4"/>
    <circle cx="1000" cy="1278" r="2"/><circle cx="320" cy="1512" r="3"/><circle cx="780" cy="1536" r="2"/>
  </g>

  <g>
    <image href="anime-character.png" x="86" y="258" width="875" height="1585" opacity=".62" filter="url(#characterGlow)"/>
    <image href="anime-character.png" x="86" y="258" width="875" height="1585" filter="url(#characterShadow)"/>
  </g>

  <g fill="#f4fbff" font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="104" font-size="16" letter-spacing="5" opacity=".78">ANIME KEY VISUAL / 01</text>
    <text x="68" y="176" font-size="78" font-weight="800" letter-spacing="5">BLUE</text>
    <text x="68" y="246" font-size="70" font-weight="800" letter-spacing="2" fill="url(#titleGrad)">HORIZON</text>
    <rect x="72" y="278" width="188" height="3" rx="2" fill="#d5f7ff" opacity=".72"/>
    <text x="72" y="306" font-size="12" letter-spacing="3" opacity=".68">RAIN LIGHT / SOFT SKY / 2026</text>
  </g>

  <g transform="translate(1005 1048) rotate(90)" fill="#effaff" font-family="Arial, Helvetica, sans-serif">
    <text font-size="12" letter-spacing="4" opacity=".65">CLOUD STUDY  /  LIGHT 01</text>
  </g>

  <g transform="translate(70 1690)">
    <rect width="278" height="124" rx="20" fill="#06245d" opacity=".52" stroke="#d7f7ff" stroke-opacity=".3"/>
    <text x="24" y="39" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3" opacity=".74">A SOFT STORM</text>
    <text x="24" y="78" fill="#d7f7ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">BLUE + ROSE</text>
    <circle cx="231" cy="62" r="18" fill="#ffb5b7" opacity=".9"/>
    <circle cx="253" cy="62" r="18" fill="#74dfff" opacity=".8"/>
  </g>

  <rect width="1080" height="1920" fill="#ffffff" opacity=".045" filter="url(#grain)"/>
  <rect x="24" y="24" width="1032" height="1872" rx="20" fill="none" stroke="#e9fbff" stroke-opacity=".24"/>
</svg>
